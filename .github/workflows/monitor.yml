name: Woningaanbod monitor

on:
  schedule:
    # Elk kwartier. GitHub houdt zich hier losjes aan bij drukte;
    # reken op een marge van 5 tot 15 minuten.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # knop om handmatig te starten

permissions:
  contents: write # nodig om seen.json terug te schrijven

concurrency:
  group: woningaanbod-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Browser uit cache halen
        id: browsercache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Browser installeren
        run: python -m playwright install --with-deps chromium

      - name: Controleren op nieuw aanbod
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Stand van zaken bewaren
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Bijgewerkt woningaanbod [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Niets gewijzigd."
          fi
